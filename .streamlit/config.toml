# One theme: the night desk (dark). Colours match app/ui.py.
[theme]
base = "dark"
primaryColor = "#EFA43F"
backgroundColor = "#0E1312"
secondaryBackgroundColor = "#151C1A"
textColor = "#E8ECE7"
font = "sans serif"
baseRadius = "medium"

[client]
toolbarMode = "viewer"

[runner]
fastReruns = true

[server]
runOnSave = false
