# Light and dark modes: choose in the menu (⋮ top right) → Settings → Light / Dark / System.
[theme]
font = "sans serif"
baseRadius = "small"

[theme.light]
primaryColor = "#3A6EA5"
backgroundColor = "#EEF1EC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2430"

[theme.dark]
primaryColor = "#7FA6D6"
backgroundColor = "#1B2430"
secondaryBackgroundColor = "#222D3B"
textColor = "#E8ECE6"

[client]
toolbarMode = "viewer"

[runner]
fastReruns = true

[server]
runOnSave = false
