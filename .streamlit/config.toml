# Light and dark modes: choose in the menu (⋮ top right) → Settings → Light / Dark / System.
[theme]
font = "sans serif"
baseRadius = "medium"

[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f9"
textColor = "#1f2937"

[theme.dark]
primaryColor = "#60a5fa"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"

[client]
toolbarMode = "viewer"

[runner]
fastReruns = true

[server]
runOnSave = false
