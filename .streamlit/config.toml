# One theme: the night desk (dark). Colours match app/ui.py.
[theme]
base = "dark"
primaryColor = "#C4AB7C"
backgroundColor = "#111413"
secondaryBackgroundColor = "#171B1A"
textColor = "#E3E6E2"
font = "sans serif"
baseRadius = "medium"

[client]
toolbarMode = "viewer"

[runner]
fastReruns = true

[server]
runOnSave = false
