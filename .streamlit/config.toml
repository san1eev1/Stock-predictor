# Light and dark modes: choose in the menu (⋮ top right) → Settings → Light / Dark / System.
[theme]
font = "sans serif"
baseRadius = "small"

[theme.light]
primaryColor = "#8C6D35"
backgroundColor = "#F2F3F1"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#151B27"

[theme.dark]
primaryColor = "#CBB27C"
backgroundColor = "#121826"
secondaryBackgroundColor = "#19202E"
textColor = "#EDE9E1"

[client]
toolbarMode = "viewer"

[runner]
fastReruns = true

[server]
runOnSave = false
