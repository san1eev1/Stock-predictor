# US stocks (S&P 500), entirely on GitHub after the US close: prices, news (with FinBERT),
# the long-term model (backtest on Mondays), and the $1,000 long-term paper book with the
# negative-news overlay. Same code as India, run with MARKET=us; US data, models and paper
# state live on their own branches (market-data-us, models-us, paper-state-us).
name: US stocks (daily)

on:
  schedule:
    - cron: "30 22 * * 1-5"     # 04:00 IST, ~2 h after the US close (late starts are fine)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-daily
  cancel-in-progress: false

env:
  MARKET: us
  PAPER_CAPITAL: "1000"
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: "1"

jobs:
  us:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-train.txt yfinance
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-news.txt
          pip install -e . --no-deps

      - name: Get US data and models
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads origin market-data-us >/dev/null; then
            git clone -q --depth 1 --branch market-data-us "$url" market-data-us
          else
            mkdir market-data-us && cd market-data-us && git init -q -b market-data-us
            git remote add origin "$url"
          fi
          cd "$GITHUB_WORKSPACE"
          git clone -q --depth 1 --branch models-us "$url" trained-models || mkdir -p trained-models

      - name: Prices (S&P 500 since 2005)
        run: |
          python -m stockpredictor init
          python -m stockpredictor import-store --dir market-data-us
          python -m stockpredictor universe
          python -m stockpredictor prices --start 2005-01-01
          python -m stockpredictor export-store --dir market-data-us

      - name: News (Google News, FinBERT)
        run: python -m stockpredictor news-update --dir market-data-us || echo "::warning::US news failed"

      - name: Long-term model
        run: |
          python -m stockpredictor train --dir market-data-us
          if [ "$(date -u +%u)" = "1" ] || [ ! -f trained-models/longterm_us/backtest.json ]; then
            python -m stockpredictor backtest --dir market-data-us
          fi

      - name: Paper book ($1,000) with the news overlay
        run: |
          python -m stockpredictor state-fetch
          python -m stockpredictor daily --dir market-data-us --no-sync
          python -m stockpredictor state-publish

      - name: Save US data and models
        if: always()
        run: |
          cd market-data-us
          git config user.name "us-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "US market data $(date -u +%Y-%m-%d)"
          git push -q origin HEAD:market-data-us || echo "::warning::US data push failed"
          cd "$GITHUB_WORKSPACE"
          python -c "from pathlib import Path; from stockpredictor import store; store.publish_branch(Path('trained-models'), 'models-us', 'US models')"
