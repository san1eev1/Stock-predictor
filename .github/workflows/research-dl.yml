# Deep-learning research (foundation-model tests) on GitHub CPUs, kept apart from the normal
# training environment: torch and the model libraries are installed only in this job.
name: Research (deep learning)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in scripts/ to run"
        default: "research_foundation.py"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-train.txt && pip install -e . --no-deps
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install einops huggingface_hub safetensors tqdm chronos-forecasting
          pip install uni2ts || echo "::warning::uni2ts (Moirai) failed to install"
          git clone -q https://github.com/shiyu-coder/Kronos kronos-src && git -C kronos-src checkout -q 67b630e
      - name: Get market data
        run: |
          git clone -q --depth 1 --branch market-data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-data
      - name: Run
        env:
          FEATURE_CACHE: "0"
          KRONOS_SRC: kronos-src
        run: python "scripts/${{ inputs.script }}" market-data
