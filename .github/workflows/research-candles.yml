# Experiment E-006: Candle aggregation timeframes (1-min, 5-min, 15-min, 1-hour)
# for intraday model performance.
name: Research (candles)

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Yahoo lookback for 1-min bars (max 7d)"
        default: "7d"

permissions:
  contents: read

jobs:
  candles:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-train.txt && pip install -e . --no-deps
      - name: Get market data
        run: |
          git clone -q --depth 1 --branch market-data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-data
      - name: Get trained models
        run: |
          git clone -q --depth 1 --branch models \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" trained-models \
            || mkdir -p trained-models
      - name: Collect 1-minute bars
        env:
          FEATURE_CACHE: "0"
        run: |
          python -m stockpredictor init
          python -m stockpredictor import-store --dir market-data
          python -m stockpredictor intraday-collect --dir market-data --period "${{ inputs.period || '7d' }}" \
            || echo "::warning::intraday collection failed"
      - name: Test candle frequencies
        env:
          FEATURE_CACHE: "0"
        run: python scripts/research_candles.py market-data
