# Company news + FinBERT sentiment, committed to the market-data branch.
# Runs a few times per trading day to stay well inside the free Actions minutes.
name: Update news

on:
  schedule:
    - cron: "30 4 * * 1-5"    # 10:00 IST
    - cron: "30 6 * * 1-5"    # 12:00 IST
    - cron: "30 8 * * 1-5"    # 14:00 IST
    - cron: "30 11 * * 1-5"   # 17:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout market-data branch
        run: |
          git clone --depth 1 --branch market-data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-v1

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-data.txt -r requirements-news.txt
          pip install -e . --no-deps

      - name: Fetch and score news
        run: python -m stockpredictor news-update --dir market-data

      - name: Commit and push
        working-directory: market-data
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "News $(date -u +%Y-%m-%dT%H:%M)"
          git push -q origin HEAD:market-data
