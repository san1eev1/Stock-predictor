# Daily market data update. Runs free on GitHub Actions and commits CSV files
# to the `market-data` branch, so the Mac never has to store or download history.
name: Update market data

on:
  schedule:
    - cron: "30 15 * * *"    # 21:00 IST, every day: the first of GitHub's two evening runs
                             # (training follows automatically: train-models.yml)
  workflow_dispatch:
    inputs:
      start:
        description: "First date for stocks with no data yet (YYYY-MM-DD)"
        default: "2005-01-01"
      extend_back:
        description: "Also download history older than what is stored, back to start"
        type: boolean
        default: false
      intraday_period:
        description: "Yahoo 5-minute lookback for intraday summaries (max 60d)"
        default: "7d"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout market-data branch (or start it)
        run: |
          if git ls-remote --exit-code --heads origin market-data >/dev/null; then
            git clone --depth 1 --branch market-data \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-data
          else
            mkdir market-data && cd market-data && git init -q -b market-data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-data.txt && pip install -e . --no-deps

      - name: Update data
        env:
          DB_PATH: /tmp/work.db
        run: |
          python -m stockpredictor init
          python -m stockpredictor import-store --dir market-data
          python -m stockpredictor universe || echo "::warning::Nifty 250 list download failed; using stored list"
          python -m stockpredictor prices --start "${{ inputs.start || '2005-01-01' }}" \
            ${{ inputs.extend_back && '--extend-back' || '' }}
          python -m stockpredictor export-store --dir market-data
          python -m stockpredictor data-check | tail -1
          python -m stockpredictor intraday-collect --dir market-data --period "${{ inputs.intraday_period || '7d' }}" \
            || echo "::warning::intraday collection failed"
          python -m stockpredictor preopen-update --dir market-data \
            || echo "::warning::pre-open data failed (NSE may block cloud servers)"
          # NSE delivery share: newest days first, then history back to 2005 in chunks.
          python -m stockpredictor delivery-update --dir market-data --minutes 25 \
            || echo "::warning::delivery data failed"
          # Every NSE stock since 2005, incl. later delisted (survivorship-free research).
          python -m stockpredictor bhav-update --dir market-data --minutes 40 \
            || echo "::warning::bhavcopy failed"
          # Fundamentals snapshot once a week (Fridays) or on manual runs.
          if [ "$(date -u +%u)" = "5" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m stockpredictor fundamentals-update --dir market-data || echo "::warning::fundamentals failed"
            python -m stockpredictor earnings-update --dir market-data || echo "::warning::results dates failed"
          fi

      - name: Commit and push
        working-directory: market-data
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -q -m "Market data $(date -u +%Y-%m-%d)"
          # Retry: GitHub occasionally returns transient 5xx errors on push.
          for i in 1 2 3 4; do
            git push -q origin HEAD:market-data && exit 0
            sleep $((i * i * 5))
          done
          exit 1
