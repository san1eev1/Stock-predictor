# Trains the long-term, news and both intraday models on all history and keeps self-tuning
# (intraday: Angel One 5-minute history, trading rules chosen by profit, 3 rounds of
# historical paper-trading replays).
# Runs free on GitHub Actions and publishes the trained models (~1 MB) to the `models`
# branch; the Mac only downloads them, so the full history never has to live on the Mac.
name: Train models

on:
  # GitHub runs twice each evening (every day), after the Mac's own 16:00 training:
  #  21:00 IST - data update (update-market-data.yml), then this training right after it;
  #  23:00 IST - a second training run. All history since 2005, both intraday models,
  #  replays, then self-tuning (~110 min each).
  workflow_run:
    workflows: ["Update market data"]
    types: [completed]
  schedule:
    - cron: "30 17 * * *"     # 23:00 IST
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget in minutes (retrain + self-tuning)"
        default: "110"
      backtest:
        description: "Refresh the long-term backtest now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: train-models
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-train.txt && pip install -e . --no-deps

      - name: Get market data, current models and paper feedback
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch market-data "$url" market-data
          git clone -q --depth 1 --branch models "$url" trained-models || mkdir -p trained-models
          git clone -q --depth 1 --branch paper-feedback "$url" feedback || mkdir -p feedback

      # Angel One 5-minute history: GitHub's private Actions cache (never committed, the repo
      # is public). Restored from the newest run, topped up, saved again under a new key.
      - name: Restore Angel One intraday history
        uses: actions/cache/restore@v4
        with:
          path: |
            data/intraday_backfill.csv
            data/intraday_fine.csv
          key: angel-intraday-${{ github.run_id }}
          restore-keys: angel-intraday-

      # Which stocks already have their full intraday history (separate cache entry, so the
      # history cache above keeps restoring from older runs).
      - name: Restore intraday download progress
        uses: actions/cache/restore@v4
        with:
          path: data/intraday_tried.json
          key: angel-tried-${{ github.run_id }}
          restore-keys: angel-tried-

      # Data-quality gate: on errors (stale/missing/broken data) this run stops here and
      # the models from the last good run stay in use.
      - name: Check data quality
        run: python -m stockpredictor quality-check --dir market-data

      - name: Train and self-tune
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          python -m stockpredictor cloud-train --dir market-data --feedback feedback \
            --minutes "${{ inputs.minutes || '110' }}" ${{ inputs.backtest && '--backtest' || '' }}

      - name: Save Angel One intraday history
        if: always() && hashFiles('data/intraday_backfill.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/intraday_backfill.csv
            data/intraday_fine.csv
          key: angel-intraday-${{ github.run_id }}

      - name: Save intraday download progress
        if: always() && hashFiles('data/intraday_tried.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/intraday_tried.json
          key: angel-tried-${{ github.run_id }}

      - name: Publish models
        working-directory: trained-models
        run: |
          # One commit, force-pushed: the branch never grows a history.
          rm -rf .git
          git init -q -b models
          git config user.name "models-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Models $(date -u +%Y-%m-%dT%H:%MZ)"
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4; do
            git push -q --force "$url" HEAD:models && exit 0
            sleep $((i * i * 5))
          done
          exit 1
