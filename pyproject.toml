[project]
name = "stockpredictor"
version = "0.1.0"
description = "Personal Nifty 100 intraday and long-term stock predictor"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
